<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음을 담은 편지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3ede2;
      font-family: 'Gowun Batang', serif;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: #fffdf9;
      padding: 35px 25px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e8e2d5;
      text-align: center;
    }

    .title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #7a5c43;
      margin-bottom: 20px;
    }

    .content {
      font-size: 0.98rem;
      line-height: 1.8;
      color: #4a3e3d;
      white-space: pre-line;
      margin-bottom: 25px;
      text-align: left;
    }

    .from {
      text-align: right;
      font-size: 1rem;
      font-weight: bold;
      color: #7a5c43;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">To. 특별한 당신에게</div>
    <div class="content">전하고 싶었던 마음을 여기에 담아 보냅니다.

늘 곁에서 힘이 되어주는 당신 덕분에
매일이 따뜻하고 감사한 순간으로 채워집니다.

오늘 하루도 편안하고 행복한 일들만 가득하기를 바라며,
언제나 당신을 응원할게요.</div>
    <div class="from">From. 마음을 담아</div>
  </div>

</body>
</html>
