<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음을 담은 편지</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f3ede2;
      font-family: 'Gowun Batang', serif;
      overflow: hidden;
    }

    /* 봉투 & 편지 전체 컨테이너 */
    .wrapper {
      position: relative;
      cursor: pointer;
    }

    .envelope-box {
      position: relative;
      width: 320px;
      height: 220px;
      background-color: #d1b89d;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    /* 봉투 덮개 (삼각형) */
    .lid {
      position: absolute;
      top: 0;
      left: 0;
      border-right: 160px solid transparent;
      border-left: 160px solid transparent;
      border-top: 120px solid #bc9d7e;
      transform-origin: top;
      transition: transform 0.5s ease-in-out, z-index 0.3s;
      z-index: 3;
    }

    /* 봉투 접힌 부분 양옆/아래 */
    .envelope-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      border-right: 160px solid #cbb094;
      border-top: 110px solid transparent;
      border-bottom: 110px solid #cbb094;
      border-left: 160px solid #c1a588;
      border-radius: 0 0 10px 10px;
      z-index: 2;
    }

    /* 편지지 스타일 */
    .letter {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 290px;
      height: 200px;
      background: #fffdf9;
      border-radius: 6px;
      padding: 20px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: all 0.6s ease-in-out;
      z-index: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #eae2d6;
    }

    .letter-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #7a5c43;
      margin-bottom: 10px;
    }

    .letter-text {
      font-size: 0.92rem;
      line-height: 1.6;
      color: #4a3e3d;
      white-space: pre-line;
      overflow-y: auto;
    }

    .letter-from {
      text-align: right;
      font-size: 0.9rem;
      font-weight: bold;
      color: #7a5c43;
      margin-top: 10px;
    }

    /* 안내 문구 */
    .click-hint {
      position: absolute;
      bottom: -40px;
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #8c7865;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
