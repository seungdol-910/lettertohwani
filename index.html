<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HWANI HEART</title>
  <style>
    /* [폰트 선택 가이드] 
       현재 적용된 폰트: 'Nanum Pen Script' (손글씨 느낌)
       만약 조금 더 또렷하고 귀여운 글씨를 원하시면 아래 주석의 다른 폰트로 바꿔보세요!
    */
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap');
    /* 대체 추천 폰트 (귀엽고 깔끔한 느낌): */
    /* @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap'); */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f1e3;
      /* 변경된 폰트 적용 (글씨 크기를 조금 키워주면 더 예쁩니다) */
      font-family: 'Nanum Pen Script', cursive;
      overflow: hidden;
      position: relative;
    }

    /* 하트 공통 스타일 */
    .heart {
      position: absolute;
      width: 40px;
      height: 40px;
      background-color: #ffcccc;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s;
      animation: float 5s infinite ease-in-out;
      z-index: 10;
    }

    /* 하트 모양 (Pseudo-elements) */
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      background-color: inherit;
      border-radius: 50%;
    }
    .heart::before {
      top: -20px;
      left: 0;
    }
    .heart::after {
      top: 0;
      left: -20px;
    }
    .heart-shape {
      transform: rotate(-45deg);
    }

    /* 가짜 하트 클릭 시 */
    .heart.wrong {
      background-color: #d1ccc0;
      cursor: default;
    }

    /* 진정한 하트 클릭 시 (편지가 나옴) */
    .heart.real {
      background-color: #ff6b6b;
      transform: scale(1.3) rotate(-45deg);
    }

    /* 편지 카드 스타일 */
    #letter-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      width: 85%;
      max-width: 420px;
      background: #fffdf9;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border: 1px solid #e8e2d5;
      text-align: center;
      z-index: 20;
      opacity: 0;
      visibility: hidden;
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* 편지 카드 등장 */
    #letter-card.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .letter-title {
      font-size: 1.8rem; /* 폰트 특성상 글씨 크기를 약간 확대 */
      font-weight: bold;
      color: #7a5c43;
      margin-bottom: 20px;
    }

    .letter-content {
      font-size: 1.5rem; /* 손글씨 폰트라 읽기 편하게 가독성 높임 */
      line-height: 1.6;
      color: #4a3e3d;
      white-space: pre-line;
      text-align: center; /* 편지 내용을 중앙 정렬로 변경해 더 감성적으로 조정 */
      margin-bottom: 25px;
    }

    .letter-from {
      text-align: right;
      font-size: 1.5rem;
      font-weight: bold;
      color: #7a5c43;
    }

    /* 하트 둥둥 떠다니는 애니메이션 */
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(-45deg); }
      25% { transform: translate(20px, -20px) rotate(-45deg); }
      50% { transform: translate(-15px, -30px) rotate(-40deg); }
      75% { transform: translate(15px, 20px) rotate(-50deg); }
    }

  </style>
</head>
<body>

  <div id="letter-card">
    <div class="letter-title">To. 환이</div>
    <div class="letter-content">
      사랑하는 내 강아지야
      내 하트를 찾아줘서 고마워

      오늘도 엄청나게 많이 사랑해    
    </div>
    <div class="letter-from">From. 승주</div>
  </div>

  <script>
    // 설정: 하트의 전체 개수
    const TOTAL_HEARTS = 15;
    const body = document.body;
    const letterCard = document.getElementById('letter-card');
    
    // 1. 임의의 하트 하나를 '진정한 하트'로 선정
    const realHeartIndex = Math.floor(Math.random() * TOTAL_HEARTS);

    // 2. 하트를 생성하고 화면에 랜덤 배치
    for (let i = 0; i < TOTAL_HEARTS; i++) {
      const heart = document.createElement('div');
      heart.classList.add('heart', 'heart-shape');

      // 랜덤 위치 설정 (화면 테두리 제외)
      const posX = Math.random() * 85; 
      const posY = Math.random() * 85; 
      heart.style.left = `${posX + 5}%`;
      heart.style.top = `${posY + 5}%`;

      // 각 하트마다 약간씩 다른 애니메이션 지연 시간 적용
      heart.style.animationDelay = `${Math.random() * 5}s`;

      // 3. 진정한 하트인지 구분
      if (i === realHeartIndex) {
        heart.addEventListener('click', () => {
          heart.classList.add('real');
          setTimeout(() => {
            letterCard.classList.add('show');
          }, 400); 
        });
      } else {
        heart.addEventListener('click', () => {
          heart.classList.add('wrong');
        });
      }

      body.appendChild(heart);
    }
  </script>

</body>
</html>
